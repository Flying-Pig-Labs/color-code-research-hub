AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Color Code Research Hub - AWS SAM Template for API Gateway and Lambda Functions

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs18.x
    Environment:
      Variables:
        GITHUB_ORG: !Ref GitHubOrg
        CLIENT_COMPANY_NAME: !Ref ClientCompanyName

Parameters:
  GitHubOrg:
    Type: String
    Default: Flying-Pig-Labs
    Description: GitHub organization name
  
  ClientCompanyName:
    Type: String
    Default: Your Company
    Description: Client company name
  
  SQSQueueUrl:
    Type: String
    Description: SQS Queue URL for research requests
    Default: ""  # Will be overridden by !Ref ResearchRequestQueue

Resources:
  # DynamoDB Table for Plan Generation Jobs
  PlanGenerationJobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: PlanGenerationJobs
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      Tags:
        - Key: Application
          Value: color-code-research-hub

  # SQS Queue for Research Requests
  ResearchRequestQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: research-requests-queue
      VisibilityTimeout: 900
      MessageRetentionPeriod: 1209600  # 14 days

  # API Gateway
  ResearchHubApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: production
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Api-Key,Authorization'"
        AllowOrigin: "'*'"
      Auth:
        ApiKeyRequired: false # Set to true if you want API key authentication

  # Reference to existing Secrets Manager secret
  # The secret is already created and contains the necessary configuration

  # Lambda Functions
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: health.handler
      Events:
        HealthCheck:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /health
            Method: GET

  TeamsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: teams.handler
      Events:
        GetTeams:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /teams
            Method: GET
        GetTeamFields:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /teams/{teamType}/fields
            Method: GET

  # GitHub Repository Function
  GitHubReposFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: githubRepos.handler
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: 
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:github_token-sIuriy
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:openai_key-PkoBXY
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:anthropic_key-47iAE6
      Events:
        ListRepos:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/github/repos
            Method: GET
        ListOrgRepos:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/github/repos/{org}
            Method: GET

  # Plan Generator Function (Original - kept for backward compatibility)
  PlanGeneratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: planGenerator.handler
      Timeout: 120
      MemorySize: 256
      Environment:
        Variables:
          ANTHROPIC_API_KEY: '{{resolve:secretsmanager:anthropic_key:SecretString:anthropic_key}}'
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: 
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:github_token-sIuriy
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:openai_key-PkoBXY
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:anthropic_key-47iAE6
      Events:
        ParseReadme:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/plan/parse-readme
            Method: POST
        PopulateForm:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/plan/populate-form
            Method: POST
        GeneratePhases:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/plan/generate-phases
            Method: POST
        CreateGitHubIssues:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/plan/create-github-issues
            Method: POST

  # Plan Generator V2 Function (Full orchestration)
  PlanGeneratorV2Function:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: planGeneratorV2.handler
      Timeout: 900 # 15 minutes for full orchestration
      MemorySize: 512
      Environment:
        Variables:
          ANTHROPIC_API_KEY: '{{resolve:secretsmanager:anthropic_key:SecretString:anthropic_key}}'
          AWS_BEDROCK_REGION: us-east-1
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: 
                - arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-3-sonnet-20240229-v1:0
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: 
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:github_token-sIuriy
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:openai_key-PkoBXY
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:anthropic_key-47iAE6
      Events:
        GenerateFullPlan:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/plan/v2/generate-full-plan
            Method: POST
        GenerateIssues:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/plan/v2/generate-issues
            Method: POST
        CreateGitHubIssuesV2:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/plan/v2/create-github-issues
            Method: POST

  # Plan Generator CLI Function (Full working implementation)
  PlanGeneratorCLIFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: planGeneratorCLI.handler
      Timeout: 900 # 15 minutes for full orchestration
      MemorySize: 512
      Environment:
        Variables:
          AWS_BEDROCK_REGION: us-east-1
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: 
                - arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-3-sonnet-20240229-v1:0
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: 
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:github_token-sIuriy
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:openai_key-PkoBXY
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:anthropic_key-47iAE6
      Events:
        GenerateCLIPlan:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/plan/generate-cli-plan
            Method: POST

  SubmitToSQSFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: submitToSQS.handler
      Environment:
        Variables:
          SQS_QUEUE_URL: !Ref ResearchRequestQueue
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - sqs:SendMessage
                - sqs:GetQueueAttributes
              Resource: !GetAtt ResearchRequestQueue.Arn
      Events:
        SubmitRequest:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/sqs/submit
            Method: POST

  # Lambda Execution Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SQSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:GetQueueAttributes
                Resource: !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:*
        - PolicyName: SecretsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: '*'
  

  # Start Plan Generation Function (Async entry point)
  StartPlanGenerationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: startPlanGeneration.handler
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          JOBS_TABLE_NAME: !Ref PlanGenerationJobsTable
          ORCHESTRATOR_FUNCTION_NAME: !Ref PlanOrchestratorFunction
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt PlanGenerationJobsTable.Arn
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
                - lambda:InvokeAsync
              Resource: !GetAtt PlanOrchestratorFunction.Arn
      Events:
        StartJob:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/plan/async/start
            Method: POST

  # Plan Orchestrator Function (Main processing)
  PlanOrchestratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: planOrchestrator.handler
      Timeout: 900 # 15 minutes
      MemorySize: 3008
      Environment:
        Variables:
          JOBS_TABLE_NAME: !Ref PlanGenerationJobsTable
          ANTHROPIC_API_KEY: '{{resolve:secretsmanager:anthropic_key:SecretString:anthropic_key}}'
          AWS_BEDROCK_REGION: us-east-1
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: 
                - arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-3-sonnet-20240229-v1:0
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:PutItem
              Resource: !GetAtt PlanGenerationJobsTable.Arn
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: 
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:github_token-sIuriy
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:openai_key-PkoBXY
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:anthropic_key-47iAE6

  # Get Job Status Function
  GetJobStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: getJobStatus.handler
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          JOBS_TABLE_NAME: !Ref PlanGenerationJobsTable
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt PlanGenerationJobsTable.Arn
      Events:
        GetStatus:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/plan/async/status/{jobId}
            Method: GET

  # Research Proxy for EC2 Claude Flow

  # Research Proxy for EC2 Claude Flow
  ResearchProxyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: researchProxy.handler
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          EC2_ENDPOINT: http://18.209.36.58:3456
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: 
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:claude-flow-research-api-key-*
      Events:
        ResearchEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/research
            Method: POST
        ExecutionEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/execution/{proxy+}
            Method: GET
        ExecutionsEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/executions
            Method: GET
        OptionsResearch:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/research
            Method: OPTIONS
        OptionsExecution:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/execution/{proxy+}
            Method: OPTIONS
        OptionsExecutions:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/executions
            Method: OPTIONS
        # New Bridge API endpoints
        SwarmsGetEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/swarms
            Method: GET
        SwarmsPostEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/swarms
            Method: POST
        SwarmDetailsEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/swarms/{id}
            Method: GET
        SwarmDeleteEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/swarms/{id}
            Method: DELETE
        LogsEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/logs
            Method: GET
        MetricsEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/metrics
            Method: GET
        SystemStatusEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/system/status
            Method: GET
        HealthEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/health
            Method: GET
        # OPTIONS methods for new endpoints
        OptionsSwarmsEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/swarms
            Method: OPTIONS
        OptionsSwarmDetailsEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/swarms/{id}
            Method: OPTIONS
        OptionsLogsEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/logs
            Method: OPTIONS
        OptionsMetricsEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/metrics
            Method: OPTIONS
        OptionsSystemStatusEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/system/status
            Method: OPTIONS
        OptionsHealthEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/health
            Method: OPTIONS


Outputs:
  ApiGatewayUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${ResearchHubApi}.execute-api.${AWS::Region}.amazonaws.com/production
    Export:
      Name: !Sub ${AWS::StackName}-ApiUrl
  
  
  JobsTableName:
    Description: Name of the DynamoDB table for job tracking
    Value: !Ref PlanGenerationJobsTable
    Export:
      Name: !Sub ${AWS::StackName}-JobsTable
  
  StartPlanGenerationFunctionArn:
    Description: ARN of the Start Plan Generation Lambda function
    Value: !GetAtt StartPlanGenerationFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-StartPlanFunction
  
  PlanOrchestratorFunctionArn:
    Description: ARN of the Plan Orchestrator Lambda function
    Value: !GetAtt PlanOrchestratorFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-OrchestratorFunction
  
  GetJobStatusFunctionArn:
    Description: ARN of the Get Job Status Lambda function
    Value: !GetAtt GetJobStatusFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-GetStatusFunction
  
  SQSQueueUrl:
    Description: URL of the research requests SQS queue
    Value: !Ref ResearchRequestQueue
    Export:
      Name: !Sub ${AWS::StackName}-QueueUrl