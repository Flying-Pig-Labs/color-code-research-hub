AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Color Code Research Hub - AWS SAM Template for API Gateway and Lambda Functions

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs18.x
    Environment:
      Variables:
        GITHUB_ORG: !Ref GitHubOrg
        CLIENT_COMPANY_NAME: !Ref ClientCompanyName

Parameters:
  GitHubOrg:
    Type: String
    Default: Flying-Pig-Labs
    Description: GitHub organization name
  
  ClientCompanyName:
    Type: String
    Default: Your Company
    Description: Client company name
  

Resources:
  # DynamoDB Table for Plan Generation Jobs
  PlanGenerationJobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: PlanGenerationJobs
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      Tags:
        - Key: Application
          Value: color-code-research-hub

  # SQS Queue for Research Requests

  # S3 Bucket for Research Results
  ResearchResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'color-code-research-results-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldResearchResults
            Status: Enabled
            ExpirationInDays: 90
      Tags:
        - Key: Application
          Value: color-code-research-hub

  # API Gateway
  ResearchHubApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: production
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Api-Key,Authorization'"
        AllowOrigin: "'*'"
      Auth:
        ApiKeyRequired: false # Set to true if you want API key authentication

  # Reference to existing Secrets Manager secret
  # The secret is already created and contains the necessary configuration

  # Lambda Functions
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: health.handler
      Events:
        HealthCheck:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /health
            Method: GET

  TeamsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: teams.handler
      Events:
        GetTeams:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /teams
            Method: GET
        GetTeamFields:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /teams/{teamType}/fields
            Method: GET

  # GitHub Repository Function
  GitHubReposFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: githubRepos.handler
      Environment:
        Variables:
          GITHUB_TOKEN_SECRET_ARN: arn:aws:secretsmanager:us-east-1:984906149037:secret:github_token-sIuriy
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: 
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:github_token-*
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:openai_key-*
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:anthropic_key-*
      Events:
        ListRepos:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/github/repos
            Method: GET
        ListOrgRepos:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/github/repos/{org}
            Method: GET

  # Plan Generator Function (Original - kept for backward compatibility)
  PlanGeneratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: planGenerator.handler
      Timeout: 120
      MemorySize: 256
      Environment:
        Variables:
          ANTHROPIC_API_KEY: '{{resolve:secretsmanager:anthropic_key:SecretString:anthropic_key}}'
          GITHUB_TOKEN_SECRET_ARN: arn:aws:secretsmanager:us-east-1:984906149037:secret:github_token-sIuriy
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: 
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:github_token-*
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:openai_key-*
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:anthropic_key-*
      Events:
        ParseReadme:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/plan/parse-readme
            Method: POST
        PopulateForm:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/plan/populate-form
            Method: POST
        GeneratePhases:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/plan/generate-phases
            Method: POST
        CreateGitHubIssues:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/plan/create-github-issues
            Method: POST

  # Plan Generator V2 Function (Full orchestration)
  PlanGeneratorV2Function:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: planGeneratorV2.handler
      Timeout: 900 # 15 minutes for full orchestration
      MemorySize: 512
      Environment:
        Variables:
          ANTHROPIC_API_KEY: '{{resolve:secretsmanager:anthropic_key:SecretString:anthropic_key}}'
          GITHUB_TOKEN_SECRET_ARN: arn:aws:secretsmanager:us-east-1:984906149037:secret:github_token-sIuriy
          AWS_BEDROCK_REGION: us-east-1
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: 
                - arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-3-sonnet-20240229-v1:0
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: 
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:github_token-*
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:openai_key-*
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:anthropic_key-*
      Events:
        GenerateFullPlan:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/plan/v2/generate-full-plan
            Method: POST
        GenerateIssues:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/plan/v2/generate-issues
            Method: POST
        CreateGitHubIssuesV2:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/plan/v2/create-github-issues
            Method: POST

  # Plan Generator CLI Function (Full working implementation)
  PlanGeneratorCLIFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: planGeneratorCLI.handler
      Timeout: 900 # 15 minutes for full orchestration
      MemorySize: 512
      Environment:
        Variables:
          AWS_BEDROCK_REGION: us-east-1
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: 
                - arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-3-sonnet-20240229-v1:0
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: 
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:github_token-*
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:openai_key-*
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:anthropic_key-*
      Events:
        GenerateCLIPlan:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/plan/generate-cli-plan
            Method: POST

  # Lambda Execution Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SecretsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: '*'
  

  # Start Plan Generation Function (Async entry point)
  StartPlanGenerationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: startPlanGeneration.handler
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          JOBS_TABLE_NAME: !Ref PlanGenerationJobsTable
          ORCHESTRATOR_FUNCTION_NAME: !Ref PlanOrchestratorFunction
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt PlanGenerationJobsTable.Arn
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
                - lambda:InvokeAsync
              Resource: !GetAtt PlanOrchestratorFunction.Arn
      Events:
        StartJob:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/plan/async/start
            Method: POST

  # Plan Orchestrator Function (Main processing)
  PlanOrchestratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: planOrchestrator.handler
      Timeout: 900 # 15 minutes
      MemorySize: 3008
      Environment:
        Variables:
          JOBS_TABLE_NAME: !Ref PlanGenerationJobsTable
          ANTHROPIC_API_KEY: '{{resolve:secretsmanager:anthropic_key:SecretString:anthropic_key}}'
          AWS_BEDROCK_REGION: us-east-1
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: 
                - arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-3-sonnet-20240229-v1:0
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:PutItem
              Resource: !GetAtt PlanGenerationJobsTable.Arn
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: 
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:github_token-*
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:openai_key-*
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:anthropic_key-*

  # Get Job Status Function
  GetJobStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: getJobStatus.handler
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          JOBS_TABLE_NAME: !Ref PlanGenerationJobsTable
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt PlanGenerationJobsTable.Arn
      Events:
        GetStatus:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/plan/async/status/{jobId}
            Method: GET

  # Research API Function - Perplexity Integration
  ResearchApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: researchApi.handler
      Runtime: python3.11
      Timeout: 900
      MemorySize: 512
      Environment:
        Variables:
          RESEARCH_BUCKET: !Ref ResearchResultsBucket
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: 
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:perplexity-key-*
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:PutObjectAcl
                - s3:GetObject
              Resource: !Sub '${ResearchResultsBucket.Arn}/*'
      Events:
        ResearchEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/research
            Method: POST
        OptionsResearch:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/research
            Method: OPTIONS
        ResearchStatusEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/research/status/{requestId}
            Method: GET
        OptionsResearchStatus:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/research/status/{requestId}
            Method: OPTIONS
        ResearchDownloadEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/research/download/{s3Key}
            Method: GET
        OptionsResearchDownload:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/research/download/{s3Key}
            Method: OPTIONS
        LogsEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/logs
            Method: GET
        MetricsEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/metrics
            Method: GET
        SystemStatusEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/system/status
            Method: GET
        HealthEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/health
            Method: GET
        # OPTIONS methods for new endpoints
        OptionsSwarmsEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/swarms
            Method: OPTIONS
        OptionsSwarmDetailsEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/swarms/{id}
            Method: OPTIONS
        OptionsLogsEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/logs
            Method: OPTIONS
        OptionsMetricsEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/metrics
            Method: OPTIONS
        OptionsSystemStatusEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/system/status
            Method: OPTIONS
        OptionsHealthEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/health
            Method: OPTIONS


Outputs:
  ApiGatewayUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${ResearchHubApi}.execute-api.${AWS::Region}.amazonaws.com/production
    Export:
      Name: !Sub ${AWS::StackName}-ApiUrl
  
  
  JobsTableName:
    Description: Name of the DynamoDB table for job tracking
    Value: !Ref PlanGenerationJobsTable
    Export:
      Name: !Sub ${AWS::StackName}-JobsTable
  
  StartPlanGenerationFunctionArn:
    Description: ARN of the Start Plan Generation Lambda function
    Value: !GetAtt StartPlanGenerationFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-StartPlanFunction
  
  PlanOrchestratorFunctionArn:
    Description: ARN of the Plan Orchestrator Lambda function
    Value: !GetAtt PlanOrchestratorFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-OrchestratorFunction
  
  GetJobStatusFunctionArn:
    Description: ARN of the Get Job Status Lambda function
    Value: !GetAtt GetJobStatusFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-GetStatusFunction
  
  
  ResearchResultsBucketName:
    Description: Name of the S3 bucket for research results
    Value: !Ref ResearchResultsBucket
    Export:
      Name: !Sub ${AWS::StackName}-ResearchBucket