AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Color Code Research Hub - AWS SAM Template for API Gateway and Lambda Functions

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs18.x
    Environment:
      Variables:
        GITHUB_ORG: !Ref GitHubOrg
        CLIENT_COMPANY_NAME: !Ref ClientCompanyName

Parameters:
  GitHubOrg:
    Type: String
    Default: Flying-Pig-Labs
    Description: GitHub organization name
  
  ClientCompanyName:
    Type: String
    Default: Your Company
    Description: Client company name
  
  SQSQueueUrl:
    Type: String
    Description: SQS Queue URL for research requests
    Default: ""  # Will be overridden by !Ref ResearchRequestQueue

Resources:
  # DynamoDB Table for Plan Generation Jobs
  PlanGenerationJobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: PlanGenerationJobs
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      Tags:
        - Key: Application
          Value: color-code-research-hub

  # SQS Queue for Research Requests
  ResearchRequestQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: research-requests-queue
      VisibilityTimeout: 900
      MessageRetentionPeriod: 1209600  # 14 days

  # API Gateway
  ResearchHubApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: production
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Api-Key'"
        AllowOrigin: "'*'"
      Auth:
        ApiKeyRequired: false # Set to true if you want API key authentication

  # Reference to existing Secrets Manager secret
  # The secret is already created and contains the necessary configuration

  # Lambda Functions
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: health.handler
      Events:
        HealthCheck:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /health
            Method: GET

  TeamsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: teams.handler
      Events:
        GetTeams:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /teams
            Method: GET
        GetTeamFields:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /teams/{teamType}/fields
            Method: GET

  # GitHub Repository Function
  GitHubReposFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: githubRepos.handler
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: 
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:github_token-sIuriy
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:openai_key-PkoBXY
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:anthropic_key-47iAE6
      Events:
        ListRepos:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/github/repos
            Method: GET
        ListOrgRepos:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/github/repos/{org}
            Method: GET

  # Plan Generator Function (Original - kept for backward compatibility)
  PlanGeneratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: planGenerator.handler
      Timeout: 120
      MemorySize: 256
      Environment:
        Variables:
          ANTHROPIC_API_KEY: '{{resolve:secretsmanager:anthropic_key:SecretString:anthropic_key}}'
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: 
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:github_token-sIuriy
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:openai_key-PkoBXY
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:anthropic_key-47iAE6
      Events:
        ParseReadme:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/plan/parse-readme
            Method: POST
        PopulateForm:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/plan/populate-form
            Method: POST
        GeneratePhases:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/plan/generate-phases
            Method: POST
        CreateGitHubIssues:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/plan/create-github-issues
            Method: POST

  # Plan Generator V2 Function (Full orchestration)
  PlanGeneratorV2Function:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: planGeneratorV2.handler
      Timeout: 900 # 15 minutes for full orchestration
      MemorySize: 512
      Environment:
        Variables:
          ANTHROPIC_API_KEY: '{{resolve:secretsmanager:anthropic_key:SecretString:anthropic_key}}'
          AWS_BEDROCK_REGION: us-east-1
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: 
                - arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-3-sonnet-20240229-v1:0
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: 
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:github_token-sIuriy
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:openai_key-PkoBXY
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:anthropic_key-47iAE6
      Events:
        GenerateFullPlan:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/plan/v2/generate-full-plan
            Method: POST
        GenerateIssues:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/plan/v2/generate-issues
            Method: POST
        CreateGitHubIssuesV2:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/plan/v2/create-github-issues
            Method: POST

  # Plan Generator CLI Function (Full working implementation)
  PlanGeneratorCLIFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: planGeneratorCLI.handler
      Timeout: 900 # 15 minutes for full orchestration
      MemorySize: 512
      Environment:
        Variables:
          AWS_BEDROCK_REGION: us-east-1
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: 
                - arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-3-sonnet-20240229-v1:0
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: 
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:github_token-sIuriy
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:openai_key-PkoBXY
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:anthropic_key-47iAE6
      Events:
        GenerateCLIPlan:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/plan/generate-cli-plan
            Method: POST

  SubmitToSQSFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: submitToSQS.handler
      Environment:
        Variables:
          SQS_QUEUE_URL: !Ref ResearchRequestQueue
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - sqs:SendMessage
                - sqs:GetQueueAttributes
              Resource: !GetAtt ResearchRequestQueue.Arn
      Events:
        SubmitRequest:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/sqs/submit
            Method: POST

  # Lambda Execution Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SQSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:GetQueueAttributes
                Resource: !Sub arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:*
        - PolicyName: SecretsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: '*'
  

  # Start Plan Generation Function (Async entry point)
  StartPlanGenerationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: startPlanGeneration.handler
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          JOBS_TABLE_NAME: !Ref PlanGenerationJobsTable
          ORCHESTRATOR_FUNCTION_NAME: !Ref PlanOrchestratorFunction
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt PlanGenerationJobsTable.Arn
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
                - lambda:InvokeAsync
              Resource: !GetAtt PlanOrchestratorFunction.Arn
      Events:
        StartJob:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/plan/async/start
            Method: POST

  # Plan Orchestrator Function (Main processing)
  PlanOrchestratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: planOrchestrator.handler
      Timeout: 900 # 15 minutes
      MemorySize: 3008
      Environment:
        Variables:
          JOBS_TABLE_NAME: !Ref PlanGenerationJobsTable
          ANTHROPIC_API_KEY: '{{resolve:secretsmanager:anthropic_key:SecretString:anthropic_key}}'
          AWS_BEDROCK_REGION: us-east-1
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: 
                - arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-3-sonnet-20240229-v1:0
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:PutItem
              Resource: !GetAtt PlanGenerationJobsTable.Arn
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: 
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:github_token-sIuriy
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:openai_key-PkoBXY
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:anthropic_key-47iAE6

  # Get Job Status Function
  GetJobStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: getJobStatus.handler
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          JOBS_TABLE_NAME: !Ref PlanGenerationJobsTable
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt PlanGenerationJobsTable.Arn
      Events:
        GetStatus:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/plan/async/status/{jobId}
            Method: GET

  # Submit Batch Job Function
  SubmitBatchJobFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: submitBatchJob.handler
      Timeout: 30
      Environment:
        Variables:
          S3_BUCKET: mvp-builder-app-bucket
          JOB_DEFINITION: MVPBacklogJob:15
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - batch:SubmitJob
                - batch:DescribeJobs
                - batch:ListJobs
                - batch:TagResource
              Resource: '*'
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource:
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:batch-job-queue-arn-a18jG3
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:PutObjectAcl
              Resource:
                - arn:aws:s3:::mvp-builder-app-bucket/*
      Events:
        SubmitJob:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/submit-job
            Method: POST

  # Stream Batch Logs Function
  StreamBatchLogsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: streamBatchLogs.handler
      Timeout: 30
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - logs:FilterLogEvents
                - logs:GetLogEvents
              Resource: '*'
            - Effect: Allow
              Action:
                - batch:DescribeJobs
              Resource: '*'
      Events:
        StreamLogs:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/job/{jobId}/logs
            Method: GET

  # Get Batch Job Status Function
  GetBatchJobStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: getBatchJobStatus.handler
      Timeout: 30
      Environment:
        Variables:
          S3_BUCKET: mvp-builder-app-bucket
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - batch:DescribeJobs
                - batch:ListJobs
              Resource: '*'
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource:
                - arn:aws:s3:::mvp-builder-app-bucket/*
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource:
                - arn:aws:s3:::mvp-builder-app-bucket
      Events:
        GetJobStatus:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/job/{jobId}/status
            Method: GET

  # Claude Flow Health Proxy
  ClaudeFlowHealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: claudeFlowProxy.healthHandler
      Timeout: 30
      Events:
        HealthCheck:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/health
            Method: GET
        HealthOptions:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/health
            Method: OPTIONS

  # Claude Flow Execute Proxy
  ClaudeFlowExecuteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: claudeFlowProxy.executeHandler
      Timeout: 30
      Events:
        Execute:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/execute
            Method: POST
        ExecuteOptions:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/execute
            Method: OPTIONS

  # Claude Flow Swarm Status Proxy
  ClaudeFlowSwarmStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: claudeFlowProxy.swarmStatusHandler
      Timeout: 30
      Events:
        SwarmStatus:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/swarm-status
            Method: GET
        SwarmStatusOptions:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/swarm-status
            Method: OPTIONS

  # Claude Flow Executions List Proxy
  ClaudeFlowExecutionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: claudeFlowProxy.executionsHandler
      Timeout: 30
      Events:
        Executions:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/executions
            Method: GET
        ExecutionsOptions:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/executions
            Method: OPTIONS

  # Claude Flow Execution Details Proxy
  ClaudeFlowExecutionDetailsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: claudeFlowProxy.executionDetailsHandler
      Timeout: 30
      Events:
        ExecutionDetails:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/execution/{id}
            Method: GET
        ExecutionDetailsOptions:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/execution/{id}
            Method: OPTIONS

  # Claude Flow Execution Logs Function
  ClaudeFlowExecutionLogsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: claudeFlowExecutionLogs.handler
      Timeout: 30
      Environment:
        Variables:
          EC2_HOST: 18.209.36.58
          EC2_PORT: 8080
      Events:
        GetLogs:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/execution/{id}/logs
            Method: GET
        OptionsLogs:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/execution/{id}/logs
            Method: OPTIONS

  # Claude Flow Execution Metadata Function
  ClaudeFlowExecutionMetadataFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: claudeFlowExecutionMetadata.handler
      Timeout: 30
      Environment:
        Variables:
          EC2_HOST: 18.209.36.58
          EC2_PORT: 8080
      Events:
        GetMetadata:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/execution/{id}/metadata
            Method: GET
        OptionsMetadata:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/execution/{id}/metadata
            Method: OPTIONS

  # Claude Flow Execution Activity Function
  ClaudeFlowExecutionActivityFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: claudeFlowExecutionActivity.handler
      Timeout: 30
      Environment:
        Variables:
          EC2_HOST: 18.209.36.58
          EC2_PORT: 8080
      Events:
        GetActivity:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/execution/{id}/activity
            Method: GET
        OptionsActivity:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/execution/{id}/activity
            Method: OPTIONS

  # ===========================================
  # MONITORING DASHBOARD LAMBDA FUNCTIONS
  # ===========================================

  # Monitoring Dashboard Data Proxy
  MonitoringDashboardFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: monitoringProxy.dashboardHandler
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          EC2_MONITORING_HOST: 18.209.36.58
          EC2_MONITORING_PORT: 3001
          MONITORING_API_KEY: '{{resolve:secretsmanager:monitoring-api-key:SecretString:key}}'
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: 
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:monitoring-api-key-*
      Events:
        GetDashboard:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/monitoring/dashboard
            Method: GET
        OptionsReq:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/monitoring/dashboard
            Method: OPTIONS

  # Monitoring Metrics Proxy
  MonitoringMetricsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: monitoringProxy.metricsHandler
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          EC2_MONITORING_HOST: 18.209.36.58
          EC2_MONITORING_PORT: 3001
          MONITORING_API_KEY: '{{resolve:secretsmanager:monitoring-api-key:SecretString:key}}'
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: 
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:monitoring-api-key-*
      Events:
        GetMetrics:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/monitoring/metrics
            Method: GET
        OptionsReq:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/monitoring/metrics
            Method: OPTIONS

  # Monitoring Agents Proxy
  MonitoringAgentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: monitoringProxy.agentsHandler
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          EC2_MONITORING_HOST: 18.209.36.58
          EC2_MONITORING_PORT: 3001
          MONITORING_API_KEY: '{{resolve:secretsmanager:monitoring-api-key:SecretString:key}}'
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: 
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:monitoring-api-key-*
      Events:
        GetAgents:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/monitoring/agents
            Method: GET
        OptionsReq:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/monitoring/agents
            Method: OPTIONS

  # Monitoring Tasks Proxy
  MonitoringTasksFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: monitoringProxy.tasksHandler
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          EC2_MONITORING_HOST: 18.209.36.58
          EC2_MONITORING_PORT: 3001
          MONITORING_API_KEY: '{{resolve:secretsmanager:monitoring-api-key:SecretString:key}}'
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: 
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:monitoring-api-key-*
      Events:
        GetTasks:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/monitoring/tasks
            Method: GET
        OptionsReq:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/monitoring/tasks
            Method: OPTIONS

  # Monitoring Alerts Proxy
  MonitoringAlertsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: monitoringProxy.alertsHandler
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          EC2_MONITORING_HOST: 18.209.36.58
          EC2_MONITORING_PORT: 3001
          MONITORING_API_KEY: '{{resolve:secretsmanager:monitoring-api-key:SecretString:key}}'
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: 
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:monitoring-api-key-*
      Events:
        GetAlerts:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/monitoring/alerts
            Method: GET
        PostAlerts:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/monitoring/alerts/{alertId}/acknowledge
            Method: POST
        OptionsReq:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/monitoring/alerts
            Method: OPTIONS
        OptionsAck:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/monitoring/alerts/{alertId}/acknowledge
            Method: OPTIONS

  # Research Proxy for EC2 Claude Flow
  ResearchProxyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: researchProxy.handler
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          EC2_ENDPOINT: http://18.209.36.58:8080
      Events:
        SubmitResearch:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/research/submit
            Method: POST
        CheckStatus:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/research/status/{proxy+}
            Method: GET
        OptionsSubmit:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/research/submit
            Method: OPTIONS
        OptionsStatus:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/research/status/{proxy+}
            Method: OPTIONS

  # SSE Monitoring Stream Proxy (with long-polling fallback)
  MonitoringStreamFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: monitoringProxy.streamHandler
      Timeout: 60  # 1 minute for long-polling
      MemorySize: 256
      Environment:
        Variables:
          EC2_MONITORING_HOST: 18.209.36.58
          EC2_MONITORING_PORT: 3001
          MONITORING_API_KEY: '{{resolve:secretsmanager:monitoring-api-key:SecretString:key}}'
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: 
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:monitoring-api-key-*
      Events:
        GetStream:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/monitoring/stream
            Method: GET
        OptionsReq:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/monitoring/stream
            Method: OPTIONS

Outputs:
  ApiGatewayUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${ResearchHubApi}.execute-api.${AWS::Region}.amazonaws.com/production
    Export:
      Name: !Sub ${AWS::StackName}-ApiUrl
  
  
  JobsTableName:
    Description: Name of the DynamoDB table for job tracking
    Value: !Ref PlanGenerationJobsTable
    Export:
      Name: !Sub ${AWS::StackName}-JobsTable
  
  StartPlanGenerationFunctionArn:
    Description: ARN of the Start Plan Generation Lambda function
    Value: !GetAtt StartPlanGenerationFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-StartPlanFunction
  
  PlanOrchestratorFunctionArn:
    Description: ARN of the Plan Orchestrator Lambda function
    Value: !GetAtt PlanOrchestratorFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-OrchestratorFunction
  
  GetJobStatusFunctionArn:
    Description: ARN of the Get Job Status Lambda function
    Value: !GetAtt GetJobStatusFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-GetStatusFunction
  
  SQSQueueUrl:
    Description: URL of the research requests SQS queue
    Value: !Ref ResearchRequestQueue
    Export:
      Name: !Sub ${AWS::StackName}-QueueUrl