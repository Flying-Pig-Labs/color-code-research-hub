version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        - npm ci
    build:
      commands:
        # Inject backend outputs into frontend env for production build
        - echo "Generating frontend/.env.production from CloudFormation outputs..."
        - >
          HOSTED_DOMAIN=$(aws cloudformation describe-stacks --stack-name AuthStack --region us-east-1 \
            --query 'Stacks[0].Outputs[?OutputKey==`HostedUIDomain`].OutputValue' --output text 2>/dev/null || true) &&
          USER_POOL_CLIENT_ID=$(aws cloudformation describe-stacks --stack-name AuthStack --region us-east-1 \
            --query 'Stacks[0].Outputs[?OutputKey==`UserPoolClientId`].OutputValue' --output text 2>/dev/null || true) &&
          API_URL=$(aws cloudformation describe-stacks --stack-name color-code-research-hub --region us-east-1 \
            --query 'Stacks[0].Outputs[?OutputKey==`ApiGatewayUrl`].OutputValue' --output text 2>/dev/null || true) &&
          echo "VITE_COGNITO_DOMAIN=$HOSTED_DOMAIN" > frontend/.env.production &&
          echo "VITE_COGNITO_CLIENT_ID=$USER_POOL_CLIENT_ID" >> frontend/.env.production &&
          echo "VITE_COGNITO_REDIRECT_URI=https://www.truflr.ai/v2/auth/callback" >> frontend/.env.production &&
          echo "VITE_API_BASE_URL=$API_URL" >> frontend/.env.production &&
          echo "Generated frontend/.env.production:" && cat frontend/.env.production
        - npm run build
        - ls -la frontend/  # Debug: Check frontend directory contents
        - ls -la frontend/dist || echo "dist directory not found"  # Debug: Check if dist exists
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=31536000, immutable'
    - pattern: 'index.html'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=0, must-revalidate'
    - pattern: '*.js'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=31536000, immutable'
    - pattern: '*.css'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=31536000, immutable'
  rewrites:
    - source: '/<*>'
      target: '/index.html'
      status: '200'
    - source: '</^[^.]+$|\.(?!(css|gif|ico|jpg|js|png|txt|svg|woff|woff2|ttf|map|json)$)([^.]+$)/>'
      target: '/index.html'
      status: '200'
