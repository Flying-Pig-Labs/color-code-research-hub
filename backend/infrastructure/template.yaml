AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Color Code Research Hub - Competitive intelligence platform with three specialized AI research teams
  (Red/Black/White) for market disruption analysis, vendor replacement, and whitespace discovery.
  Features 20+ Lambda functions, DynamoDB tables, API Gateway, and integration with Perplexity AI
  for deep research. Deploy to us-east-1 with stack name: color-code-research-hub

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs18.x
    Environment:
      Variables:
        GITHUB_ORG: !Ref GitHubOrg
        CLIENT_COMPANY_NAME: !Ref ClientCompanyName

Parameters:
  GitHubOrg:
    Type: String
    Default: Flying-Pig-Labs
    Description: GitHub organization name
  
  ClientCompanyName:
    Type: String
    Default: Your Company
    Description: Client company name

  # V2 Data Layer resource names (defaults match CDK DataLayerStack)
  UsersTableNameParam:
    Type: String
    Default: Users
  CreditLedgerTableNameParam:
    Type: String
    Default: CreditLedger
  ProjectsTableNameParam:
    Type: String
    Default: Projects
  ReportsTableNameParam:
    Type: String
    Default: Reports
  IdeationsTableNameParam:
    Type: String
    Default: Ideations
  DoubleDownsTableNameParam:
    Type: String
    Default: DoubleDowns
  ArtifactsBucketNameParam:
    Type: String
    Default: datalayerstack-artifacts
  StripeApiKeySecretArn:
    Type: String
    Default: arn:aws:secretsmanager:us-east-1:984906149037:secret:stripe_api_key-pmgNww
  StripePriceCredit:
    Type: String
    Default: ""
  StripeWebhookSecret:
    Type: String
    Default: ""

  CognitoUserPoolIdParam:
    Type: String
    Default: ""
  
  CognitoUserPoolArnParam:
    Type: String
    Default: ""
  

Resources:
  # Shared execution role for V2 Python Lambdas
  V2LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: V2DynamoAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Scan
                  - dynamodb:Query
                Resource:
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${UsersTableNameParam}
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CreditLedgerTableNameParam}
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectsTableNameParam}
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ReportsTableNameParam}
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${IdeationsTableNameParam}
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DoubleDownsTableNameParam}
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ReportsTableNameParam}/index/*
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ProjectsTableNameParam}/index/*
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CreditLedgerTableNameParam}/index/*
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${IdeationsTableNameParam}/index/*
                  - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DoubleDownsTableNameParam}/index/*
        - PolicyName: V2ArtifactsS3
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub arn:aws:s3:::${ArtifactsBucketNameParam}
                  - !Sub arn:aws:s3:::${ArtifactsBucketNameParam}/*
        - PolicyName: V2StripeSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref StripeApiKeySecretArn
        - PolicyName: V2InvokePdf
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt V2GeneratePdfFunction.Arn
  # SQS Queue for Report Processing
  ReportProcessingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-ReportProcessingQueue'
      VisibilityTimeout: 960  # 16 minutes (longer than Lambda timeout)
      MessageRetentionPeriod: 86400  # 24 hours
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ReportProcessingDLQ.Arn
        maxReceiveCount: 3

  # Dead Letter Queue for failed processing
  ReportProcessingDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-ReportProcessingDLQ'
      MessageRetentionPeriod: 1209600  # 14 days

  # DynamoDB Table for Plan Generation Jobs
  # Stores async job state, progress tracking, and results
  # TTL enabled for automatic cleanup after 24 hours
  PlanGenerationJobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: PlanGenerationJobs
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      Tags:
        - Key: Application
          Value: color-code-research-hub

  # DynamoDB Table for Research Reports Metadata
  # Stores research report metadata with team-based indexing
  # Supports multi-tenant architecture with TTL cleanup
  ResearchReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ResearchReports
      AttributeDefinitions:
        - AttributeName: reportId
          AttributeType: S
        - AttributeName: team
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: reportId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: team-createdAt-index
          KeySchema:
            - AttributeName: team
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      BillingMode: PAY_PER_REQUEST
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: Application
          Value: color-code-research-hub

  # SQS Queue for Research Requests

  # S3 Bucket for Research Results
  # Stores full research reports with versioning and encryption
  # Lifecycle policy deletes reports after 90 days
  ResearchResultsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'color-code-research-results-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldResearchResults
            Status: Enabled
            ExpirationInDays: 90
      Tags:
        - Key: Application
          Value: color-code-research-hub

  # API Gateway - Main REST API
  # Handles all HTTP requests with CORS support
  # Routes to appropriate Lambda functions
  ResearchHubApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: production
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,Authorization,X-Api-Key,Accept,Idempotency-Key'"
        AllowMethods: "'GET,POST,OPTIONS,PUT,DELETE'"
        MaxAge: "'86400'"
      Auth:
        ApiKeyRequired: false # Set to true if you want API key authentication

  # Reference to existing Secrets Manager secret
  # The secret is already created and contains the necessary configuration

  # Lambda Functions
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: health.handler
      Events:
        HealthCheck:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /health
            Method: GET

  # GitHub Repository Function
  GitHubReposFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: githubRepos.handler
      Environment:
        Variables:
          GITHUB_TOKEN_SECRET_ARN: arn:aws:secretsmanager:us-east-1:984906149037:secret:github_token-sIuriy
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: 
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:github_token-*
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:openai_key-*
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:anthropic_key-*
      Events:
        ListRepos:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/github/repos
            Method: GET
        ListOrgRepos:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/github/repos/{org}
            Method: GET

  # Lambda Execution Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SecretsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: '*'
  

  # Start Plan Generation Function (Async entry point)
  StartPlanGenerationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: startPlanGeneration.handler
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          JOBS_TABLE_NAME: !Ref PlanGenerationJobsTable
          ORCHESTRATOR_FUNCTION_NAME: !Ref PlanOrchestratorFunction
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt PlanGenerationJobsTable.Arn
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
                - lambda:InvokeAsync
              Resource: !GetAtt PlanOrchestratorFunction.Arn
      Events:
        StartJob:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/plan/async/start
            Method: POST

  # Plan Orchestrator Function (Main processing)
  PlanOrchestratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: planOrchestrator.handler
      Timeout: 900 # 15 minutes
      MemorySize: 3008
      Environment:
        Variables:
          JOBS_TABLE_NAME: !Ref PlanGenerationJobsTable
          ANTHROPIC_API_KEY: '{{resolve:secretsmanager:anthropic_key:SecretString:anthropic_key}}'
          AWS_BEDROCK_REGION: us-east-1
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:PutItem
              Resource: !GetAtt PlanGenerationJobsTable.Arn
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: 
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:github_token-*
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:openai_key-*
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:anthropic_key-*
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:BlueOceanApiKeys7FCB6430-*

  # Get Job Status Function
  GetJobStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: getJobStatus.handler
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          JOBS_TABLE_NAME: !Ref PlanGenerationJobsTable
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt PlanGenerationJobsTable.Arn
      Events:
        GetStatus:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/plan/async/status/{jobId}
            Method: GET

  # List Plan Generation Jobs Function
  ListPlanJobsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: listPlanGenerationJobs.handler
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          JOBS_TABLE_NAME: !Ref PlanGenerationJobsTable
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Scan
                - dynamodb:Query
              Resource: !GetAtt PlanGenerationJobsTable.Arn
      Events:
        ListJobs:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/plan/async/list
            Method: GET
        OptionsListJobs:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/plan/async/list
            Method: OPTIONS

  # Lambda Layer for Python Dependencies
  PythonDependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: python-dependencies-layer
      Description: Layer containing Python dependencies for report processing
      ContentUri: ../layers/python-dependencies/
      CompatibleRuntimes:
        - python3.11
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: python3.11

  # Research API Function - Perplexity Integration (Python)
  ResearchApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: researchApi.handler
      Runtime: python3.11
      Timeout: 900
      MemorySize: 512
      Environment:
        Variables:
          RESEARCH_BUCKET: !Ref ResearchResultsBucket
          RESEARCH_REPORTS_TABLE: !Ref ResearchReportsTable
          REPORT_PROCESSING_FUNCTION_NAME: !Ref ReportProcessingFunction
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: 
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:perplexity-key-*
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:PutObjectAcl
                - s3:GetObject
              Resource: !Sub '${ResearchResultsBucket.Arn}/*'
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:UpdateItem
              Resource: 
                - !GetAtt ResearchReportsTable.Arn
                - !Sub '${ResearchReportsTable.Arn}/index/*'
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt ReportProcessingFunction.Arn
      Events:
        ResearchEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/research
            Method: POST
        OptionsResearch:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/research
            Method: OPTIONS
        ResearchStatusEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/research/status/{requestId}
            Method: GET
        OptionsResearchStatus:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/research/status/{requestId}
            Method: OPTIONS
        ResearchDownloadEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/research/download/{s3Key}
            Method: GET
        OptionsResearchDownload:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/research/download/{s3Key}
            Method: OPTIONS
        ResearchReportsEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/research/reports
            Method: GET
        OptionsResearchReports:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/research/reports
            Method: OPTIONS

  # Enhanced Research Report Function - Node.js with advanced data formats
  GenerateResearchReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: generateResearchReport.handler
      Runtime: nodejs18.x
      Timeout: 900
      MemorySize: 1024
      Environment:
        Variables:
          RESEARCH_BUCKET: !Ref ResearchResultsBucket
          RESEARCH_REPORTS_TABLE: !Ref ResearchReportsTable
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: 
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:perplexity-key-*
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:PutObjectAcl
                - s3:GetObject
              Resource: !Sub '${ResearchResultsBucket.Arn}/*'
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:UpdateItem
              Resource: 
                - !GetAtt ResearchReportsTable.Arn
                - !Sub '${ResearchReportsTable.Arn}/index/*'
      Events:
        # Enhanced research endpoints with structured data
        EnhancedResearchEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/research/v2
            Method: POST
        OptionsEnhancedResearch:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/research/v2
            Method: OPTIONS
        EnhancedResearchStatusEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/research/v2/status/{requestId}
            Method: GET
        OptionsEnhancedResearchStatus:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/research/v2/status/{requestId}
            Method: OPTIONS
        EnhancedResearchReportsEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/research/v2/reports
            Method: GET
        OptionsEnhancedResearchReports:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/research/v2/reports
            Method: OPTIONS

  # DynamoDB Stream Processor - Detects completed research and sends to SQS
  ResearchStreamProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: researchStreamProcessor.handler
      Runtime: nodejs18.x
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          REPORT_PROCESSING_QUEUE_URL: !Ref ReportProcessingQueue
          RESEARCH_REPORTS_TABLE: !Ref ResearchReportsTable
          RESEARCH_BUCKET: !Ref ResearchResultsBucket
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - sqs:SendMessage
              Resource: !GetAtt ReportProcessingQueue.Arn
            - Effect: Allow
              Action:
                - dynamodb:DescribeStream
                - dynamodb:GetRecords
                - dynamodb:GetShardIterator
                - dynamodb:ListStreams
              Resource: 
                - !Sub '${ResearchReportsTable.Arn}/stream/*'
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
                - dynamodb:GetItem
              Resource: !GetAtt ResearchReportsTable.Arn
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub '${ResearchResultsBucket.Arn}/*'
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: 
                - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:perplexity-key*'
                - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:openai_key*'
      Events:
        Stream:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt ResearchReportsTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 5

  # Report Processing Function - Enhanced Research Post-Processing (Node.js)
  ReportProcessingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: reportProcessor.handler
      Runtime: nodejs18.x
      Timeout: 900
      MemorySize: 3008
      Environment:
        Variables:
          REPORT_BUCKET: !Ref ResearchResultsBucket
          RESEARCH_REPORTS_TABLE: !Ref ResearchReportsTable
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: 
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:anthropic_key-*
                - arn:aws:secretsmanager:us-east-1:984906149037:secret:openai_key-*
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:PutObjectAcl
                - s3:GetObject
                - s3:ListBucket
              Resource: 
                - !Sub '${ResearchResultsBucket.Arn}/*'
                - !GetAtt ResearchResultsBucket.Arn
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:UpdateItem
              Resource: 
                - !GetAtt ResearchReportsTable.Arn
                - !Sub '${ResearchReportsTable.Arn}/index/*'
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: 
                - arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-3-5-sonnet-20240620-v1:0
                - arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-3-5-sonnet-20241022-v2:0
            - Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
              Resource: !GetAtt ReportProcessingQueue.Arn
      Events:
        ProcessFromQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt ReportProcessingQueue.Arn
            BatchSize: 1  # Process one report at a time
        ProcessReportEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/reports/process
            Method: POST
        OptionsProcessReport:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/reports/process
            Method: OPTIONS
        EnhanceReportEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/reports/enhance/{reportId}
            Method: POST
        OptionsEnhanceReport:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/reports/enhance/{reportId}
            Method: OPTIONS
        LogsEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/logs
            Method: GET
        MetricsEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/metrics
            Method: GET
        SystemStatusEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/system/status
            Method: GET
        HealthEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/health
            Method: GET
        # OPTIONS methods for new endpoints
        OptionsSwarmsEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/swarms
            Method: OPTIONS
        OptionsSwarmDetailsEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/swarms/{id}
            Method: OPTIONS
        OptionsLogsEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/logs
            Method: OPTIONS
        OptionsMetricsEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/metrics
            Method: OPTIONS
        OptionsSystemStatusEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/system/status
            Method: OPTIONS
        OptionsHealthEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/claude-flow/health
            Method: OPTIONS

  # Get Individual Report Function
  GetReportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../lambda/handlers/
      Handler: getReportHandler.handler
      Runtime: nodejs18.x
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          RESEARCH_BUCKET: !Ref ResearchResultsBucket
          RESEARCH_REPORTS_TABLE: !Ref ResearchReportsTable
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub '${ResearchResultsBucket.Arn}/*'
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: 
                - !GetAtt ResearchReportsTable.Arn
      Events:
        GetReportEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/research/reports/{reportId}
            Method: GET
        OptionsGetReport:
          Type: Api
          Properties:
            RestApiId: !Ref ResearchHubApi
            Path: /api/research/reports/{reportId}
            Method: OPTIONS

  
